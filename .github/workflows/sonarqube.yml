name: Pruebas y análisis SonarQube Cloud

on:
  push:
    branches:
      - desarrollo
  pull_request:
    branches:
      - desarrollo
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pruebas-y-analisis:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar herramientas de prueba
        run: python -m pip install pytest pytest-cov

      - name: Ejecutar pruebas y generar cobertura
        run: python -m pytest --cov=appdesarrollo --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
